  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'DM Sans',sans-serif;background:#f0f2f6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
    .card{background:white;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.10);width:100%;max-width:420px;overflow:hidden}
    .header{background:linear-gradient(160deg,#253445 0%,#192638 100%);padding:32px 28px 28px;text-align:center}
    .logo-wrap{width:90px;height:90px;border-radius:14px;overflow:hidden;margin:0 auto 18px;background:#F7C800}
    .logo-wrap img{width:100%;height:100%;object-fit:contain}
    .header h1{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:white;margin-bottom:6px}
    .header p{font-size:13px;color:rgba(255,255,255,.6)}
    .body{padding:28px}
    .btn{display:flex;align-items:center;gap:12px;width:100%;padding:16px 20px;border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;margin-bottom:12px;transition:transform .15s,box-shadow .15s}
    .btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.15)}
    .btn:last-child{margin-bottom:0}
    .btn-icon{width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .btn-green{background:linear-gradient(135deg,#38a169,#2f855a);color:white}
    .btn-orange{background:linear-gradient(135deg,#FF6B35,#e85c2f);color:white}
    .btn-blue{background:linear-gradient(135deg,#3182ce,#2b6cb0);color:white}
    .footer-txt{text-align:center;font-size:11px;color:#a0aec0;margin-top:20px;padding-bottom:4px}
  </style>
